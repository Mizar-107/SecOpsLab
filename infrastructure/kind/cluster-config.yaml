# Kind cluster configuration for SecOpsLab
# Multi-node cluster with ingress support
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: secopslab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP for ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS for ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # Argo CD UI
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
